version: "3.9"

services:
  guanlan-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guanlan-runtime
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PYTHONUNBUFFERED=1
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
      - ./final_reports:/app/final_reports
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: guanlan-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-guanlan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-guanlan}
      POSTGRES_DB: ${DB_NAME:-guanlan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
